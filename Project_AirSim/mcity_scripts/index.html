<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mcity Drone GPS - Live Map</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel">
    <h1>Mcity Drone GPS</h1>
    <div id="conn" class="status disconnected">WS: connecting&hellip;</div>
    <div id="drones"></div>
    <label class="opt">
      <input type="checkbox" id="follow" checked /> Follow drone
    </label>
    <button id="clear-trail">Clear trail</button>
    <div id="key-warning" class="warning" hidden>
      No Google Maps API key set &mdash; edit <code>config.js</code>.
    </div>
  </div>
  <div id="map"></div>

  <script src="env.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
